<script src="https://cdn.tailwindcss.com"></script>
{% extends "base.html" %}

{% block title %} คอมมูนิตี้ลูกวัว {% endblock %}

{% block content %}
<h2 class="text-3xl font-bold text-center text-green-700 mb-6">🐮 คอมมูนิตี้ลูกวัว</h2>

<div class="container mx-auto px-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        {% for cow in cows %}
        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
            <img src="{{ cow.image.url }}" class="w-full h-56 object-cover" alt="{{ cow.name }}">
            <div class="p-4">
                <h5 class="text-lg font-semibold text-gray-800">{{ cow.name }}</h5>
                <p class="text-gray-600">พันธุ์: {{ cow.breed }}</p>
                <p class="text-gray-600">อายุ: {{ cow.age }} ปี</p>
                <a href="{% url 'cow_detail' cow.pk %}" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg block text-center mt-4 transition">
                    ดูรายละเอียด
                </a>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-gray-500 w-full">ยังไม่มีลูกวัวในคอมมูนิตี้</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
