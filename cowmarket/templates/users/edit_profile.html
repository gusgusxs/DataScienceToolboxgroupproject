<script src="https://cdn.tailwindcss.com"></script>
{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto my-10 p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">🔧 แก้ไขข้อมูลติดต่อ</h2>

    <form method="POST" class="space-y-4">
        {% csrf_token %}

        {% for field in form %}
        <div class="mb-4">
            <label for="{{ field.id_for_label }}" class="block text-gray-700 font-semibold mb-1">
                {{ field.label }}
            </label>
            <div class="flex items-center space-x-2">
                {{ field }}
                {% if field.help_text %}
                    <p class="text-sm text-gray-500">{{ field.help_text }}</p>
                {% endif %}
            </div>
            {% for error in field.errors %}
                <p class="text-red-500 text-sm">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}

        <button type="submit" 
                class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg transition">
            💾 บันทึกข้อมูล
        </button>
    </form>
</div>
{% endblock %}
