<script src="https://cdn.tailwindcss.com"></script>
{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto my-10 p-6 bg-white shadow-lg rounded-lg">
    <h2 class="text-2xl font-bold text-red-600 text-center mb-6">🗑️ ลบลูกวัว "{{ cow.name }}"?</h2>
    <p class="text-gray-700 text-center mb-6">คุณแน่ใจหรือไม่ว่าต้องการลบลูกวัวตัวนี้? <br> การดำเนินการนี้ไม่สามารถย้อนกลับได้</p>

    <form method="POST" class="space-y-4 text-center">
        {% csrf_token %}
        <button type="submit" 
                class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-6 rounded-lg transition">
            ✅ ยืนยันการลบ
        </button>
    </form>

    <div class="mt-6 text-center">
        <a href="{% url 'cow_list' %}" 
           class="text-gray-600 hover:text-gray-800 font-semibold transition">
            ⬅️ ยกเลิก
        </a>
    </div>
</div>
{% endblock %}
