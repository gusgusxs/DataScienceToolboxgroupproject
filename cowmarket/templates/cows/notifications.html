<script src="https://cdn.tailwindcss.com"></script>
{% extends "base.html" %}

{% block content %}
<h2 class="text-3xl font-bold text-center text-green-700 mb-6">🔔 แจ้งเตือนของฉัน</h2>

<ul class="space-y-4">
    {% for notification in notifications %}
    <li class="bg-white p-4 shadow-lg rounded-lg">
        <p class="text-gray-800">{{ notification.message }}</p>
        <small class="text-gray-500">{{ notification.created_at }}</small>
    </li>
    {% empty %}
    <li class="bg-white p-4 shadow-lg rounded-lg text-center text-gray-500">
        ✅ ไม่มีการแจ้งเตือน
    </li>
    {% endfor %}
</ul>
{% endblock %}
