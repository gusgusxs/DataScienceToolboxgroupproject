{% extends "base.html" %}

{% block content %}
<h2>🔔 แจ้งเตือนของฉัน</h2>
<ul>
    {% for notification in notifications %}
        <li>{{ notification.message }} - <small>{{ notification.created_at }}</small></li>
    {% empty %}
        <li>✅ ไม่มีการแจ้งเตือน</li>
    {% endfor %}
</ul>
{% endblock %}
